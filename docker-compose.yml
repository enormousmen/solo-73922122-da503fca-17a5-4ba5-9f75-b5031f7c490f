# 交换机配置重载台 —— 单服务 Compose。
# Flask 值班台与“本地双栈 HTTPS 样例设备”在同一容器网络命名空间内：
# 值班台经 ::1（IPv6）与 127.0.0.1（IPv4）访问设备，无需为 Docker 开启 IPv6。
services:
  reload-console:
    build:
      context: .
      dockerfile: Dockerfile
    image: gsb-reload-console:latest
    container_name: gsb-reload-console
    ports:
      - "8080:8080"
    environment:
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8080"
      DEVICE_PORT: "8443"
      DEVICE_NAME: "switch-demo.local"
    restart: unless-stopped

# 证书在容器启动时自动生成于 /app/certs（容器可写层，appuser 可写）；
# 如需信任内置 CA，可用 `docker compose cp reload-console:/app/certs/ca.pem ./ca.pem` 取出。
